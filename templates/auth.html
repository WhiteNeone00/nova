<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova Authentication</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800;900&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --purple: #a855f7;
      --blue: #3b82f6;
      --bg: #020204;
    }

    body {
      background: var(--bg);
      color: #fff;
      font-family: Outfit, "Outfit Fallback", -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .background {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -50;
      overflow: hidden;
      background:
        linear-gradient(100deg, #14092b 0%, #0a0f25 48%, #03172b 100%),
        radial-gradient(circle at 18% 56%, rgba(124, 58, 237, 0.24), rgba(8, 10, 20, 0) 54%),
        radial-gradient(circle at 84% 52%, rgba(37, 99, 235, 0.3), rgba(5, 10, 22, 0) 50%);
      pointer-events: none;
    }

    .bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(255,255,255,0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.06) 1px, transparent 1px);
      background-size: 80px 80px;
      opacity: 0.18;
      pointer-events: none;
    }

    .bg-grid-fine {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(148, 163, 184, 0.12) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(148, 163, 184, 0.12) 1px, transparent 1px);
      background-size: 35px 35px;
      opacity: 0.4;
      pointer-events: none;
    }

    .bg-gradient {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.3;
      transform: translateZ(0);
    }

    .bg-purple {
      width: 90vw;
      height: 90vw;
      background: rgba(147, 51, 234, 0.45);
      top: -10%;
      left: -10%;
    }

    .bg-blue {
      width: 85vw;
      height: 85vw;
      background: rgba(37, 99, 235, 0.45);
      top: 40%;
      left: 50%;
    }

    .bg-pink {
      width: 80vw;
      height: 80vw;
      background: rgba(88, 28, 135, 0.45);
      top: 60%;
      left: -15%;
    }

    .bg-violet {
      width: 75vw;
      height: 75vw;
      background: rgba(30, 58, 138, 0.45);
      top: -25%;
      left: 65%;
    }

    .bg-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 0%, rgba(2, 2, 4, 0.6) 100%);
      pointer-events: none;
    }

    .auth-page {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      background: rgba(62, 35, 75, 0.1);
      backdrop-filter: blur(0px);
      border-bottom: 1px solid rgba(255, 255, 255, 0);
      transition: background-color 0.6s cubic-bezier(0.22, 1, 0.36, 1), backdrop-filter 0.6s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.6s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: background-color, backdrop-filter, border-color;
      pointer-events: none;
      display: flex;
      justify-content: center;
    }

    header.nav-scrolled {
      background: rgba(17, 17, 20, 0.4);
      backdrop-filter: blur(10px);
      border-bottom-color: rgba(255, 255, 255, 0.1);
    }

    nav {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: auto;
    }

    .nav-left,
    .nav-right {
      flex: 1;
      display: flex;
      align-items: center;
    }

    .nav-left {
      justify-content: flex-start;
    }

    .nav-right {
      justify-content: flex-end;
    }

    .logo {
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .nav-links {
      display: none;
      gap: 3rem;
      flex: 2;
      justify-content: center;
      align-items: center;
    }

    @media (min-width: 1024px) {
      .nav-links {
        display: flex;
      }
    }

    .nav-link {
      text-decoration: none;
      color: #a0aec0;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.3s;
      position: relative;
    }

    .nav-link:hover {
      color: #fff;
    }

    .nav-link::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 50%;
      width: 0;
      height: 1.5px;
      background: var(--purple);
      transform: translateX(-50%);
      transition: width 0.3s;
      opacity: 0.4;
      box-shadow: 0 0 8px rgba(168, 85, 247, 0.5);
    }

    .nav-link:hover::after {
      width: 100%;
    }

    .sign-in-btn {
      padding: 10px 32px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: transparent;
      color: #fff;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      transition: all 0.3s;
      white-space: nowrap;
    }

    .sign-in-btn:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .auth-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 90px 16px 24px;
    }

    .auth-wrap {
      width: min(420px, 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 10;
    }

    .back-row {
      width: 100%;
      margin-bottom: 22px;
      padding: 0 4px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.4);
      transition: color 0.3s;
    }

    .back-link:hover {
      color: #fff;
    }

    .back-link svg {
      width: 14px;
      height: 14px;
      transition: transform 0.25s ease;
    }

    .back-link:hover svg {
      transform: translateX(-4px);
    }

    .auth-card {
      width: 100%;
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(7px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 2rem;
      padding: 32px;
      box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      position: relative;
      overflow: hidden;
    }

    .auth-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(168, 85, 247, 0.2), transparent);
    }

    .auth-logo {
      width: 56px;
      height: 56px;
      object-fit: contain;
      opacity: 0.9;
    }

    .auth-head {
      text-align: center;
      width: 100%;
    }

    .auth-head h1 {
      font-size: 42px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      margin-bottom: 8px;
    }

    .auth-head p {
      color: rgba(156, 163, 175, 0.6);
      font-size: 14px;
      font-weight: 500;
    }

    form {
      width: 100%;
      display: grid;
      gap: 20px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field label {
      color: #9ca3af;
      font-size: 14px;
      margin-left: 4px;
      font-weight: 500;
    }

    .input-wrap {
      height: 56px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      transition: border-color 0.3s, background-color 0.3s;
    }

    .input-wrap:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .input-wrap:focus-within {
      border-color: rgba(168, 85, 247, 0.9);
    }

    .input-wrap svg {
      width: 18px;
      height: 18px;
      color: rgba(192, 132, 252, 0.9);
      flex-shrink: 0;
    }

    .input-wrap input {
      border: 0;
      outline: none;
      width: 100%;
      height: 100%;
      background: transparent;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
    }

    .input-wrap input::placeholder {
      color: rgba(255, 255, 255, 0.2);
    }

    .toggle-pass {
      border: 0;
      background: transparent;
      cursor: pointer;
      color: rgba(156, 163, 175, 0.75);
      opacity: 0.45;
      transition: opacity 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .toggle-pass:hover {
      opacity: 1;
    }

    .forgot {
      padding-top: 3px;
    }

    .forgot a {
      color: rgba(192, 132, 252, 0.85);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s;
    }

    .forgot a:hover {
      color: rgba(192, 132, 252, 1);
    }

    .submit {
      width: 100%;
      height: 56px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.35);
    }

    .submit:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .switch-btn {
      width: 100%;
      height: 48px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: transparent;
      color: #d1d5db;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s;
    }

    .switch-btn:hover {
      background: rgba(255, 255, 255, 0.02);
      border-color: rgba(168, 85, 247, 0.5);
      color: #fff;
    }

    .mode-panel {
      width: 100%;
      display: none;
      gap: 24px;
      flex-direction: column;
      align-items: center;
    }

    .mode-panel.active {
      display: flex;
    }

    .legal {
      margin-top: 34px;
      text-align: center;
      opacity: 0.4;
      transition: opacity 0.3s;
      white-space: nowrap;
      padding: 0 8px;
    }

    .legal:hover {
      opacity: 1;
    }

    .legal p {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.4);
      font-weight: 500;
    }

    .legal a {
      color: #fff;
      text-decoration: none;
      transition: color 0.3s;
    }

    .legal a:hover {
      color: rgba(192, 132, 252, 0.95);
    }

    @media (max-width: 520px) {
      nav {
        padding: 0.8rem 1rem;
      }

      .nav-links {
        display: none;
      }

      .sign-in-btn {
        padding: 8px 20px;
        font-size: 13px;
      }

      .auth-card {
        padding: 28px 20px;
      }

      .auth-head h1 {
        font-size: 36px;
      }

      .legal {
        white-space: normal;
      }
    }
  </style>
</head>
<body>
  <main class="auth-page">
    <div class="background">
      <div style="position: absolute; inset: 0; opacity: 0.55;"></div>
      <div class="bg-grid"></div>
      <div class="bg-grid-fine"></div>
      <div class="bg-gradient bg-purple"></div>
      <div class="bg-gradient bg-blue"></div>
      <div class="bg-gradient bg-pink"></div>
      <div class="bg-gradient bg-violet"></div>
      <div class="bg-vignette"></div>
    </div>

    <header>
      <nav>
        <div class="nav-left">
          <a href="/" class="logo">
            <img src="/logo.png" alt="Nova Logo" width="40" height="40">
          </a>
        </div>
        <div class="nav-links">
          <a href="/" class="nav-link">Home</a>
          <a href="/#features" class="nav-link">Features</a>
          <a href="/reviews" class="nav-link">Reviews</a>
          <a href="/policy" class="nav-link">Policy</a>
          <a href="/#plans" class="nav-link">Plans</a>
          <a href="/#faq" class="nav-link">FAQ</a>
          <a href="https://discord.gg/sided" target="_blank" class="nav-link">Discord</a>
        </div>
        <div class="nav-right">
          <a href="/auth" class="sign-in-btn">Sign In</a>
        </div>
      </nav>
    </header>

    <div class="auth-content">
      <div class="auth-wrap">
        <div class="back-row">
          <a href="/" class="back-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m12 19-7-7 7-7"></path>
              <path d="M19 12H5"></path>
            </svg>
            Back to Home
          </a>
        </div>

        <section class="auth-card">
          <div class="mode-panel active" data-mode="login">
            <img src="/logo.png" alt="Nova Logo" class="auth-logo">

            <div class="auth-head">
              <h1>Welcome Back</h1>
              <p>Enter your details to access your dashboard.</p>
            </div>

            <form action="#" method="post">
              <div class="field">
                <label for="email">Email Address</label>
                <div class="input-wrap">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"></path>
                    <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                  </svg>
                  <input id="email" name="email" type="email" placeholder="Enter your email address" autocomplete="email" required>
                </div>
              </div>

              <div class="field">
                <label for="password">Password</label>
                <div class="input-wrap">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                  </svg>
                  <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
                  <button type="button" class="toggle-pass" aria-label="Toggle password visibility" data-toggle-pass="password">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path>
                      <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                  </button>
                </div>
                <div class="forgot"><a href="/reset-password">Forgot your password?</a></div>
              </div>

              <button class="submit" type="submit">Sign In</button>
              <button class="switch-btn" type="button" data-switch-to="signup">Don't have an account? Sign up</button>
            </form>
          </div>

          <div class="mode-panel" data-mode="signup">
            <img src="/logo.png" alt="Nova Logo" class="auth-logo">

            <div class="auth-head">
              <h1>Create Account</h1>
              <p>Join Nova and start executing today.</p>
            </div>

            <form action="#" method="post">
              <div class="field">
                <label for="username">Username</label>
                <div class="input-wrap">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                  </svg>
                  <input id="username" name="username" type="text" placeholder="Choose a username" autocomplete="username" required>
                </div>
              </div>

              <div class="field">
                <label for="signup-email">Email Address</label>
                <div class="input-wrap">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"></path>
                    <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                  </svg>
                  <input id="signup-email" name="email" type="email" placeholder="Enter your email address" autocomplete="email" required>
                </div>
              </div>

              <div class="field">
                <label for="signup-password">Password</label>
                <div class="input-wrap">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                  </svg>
                  <input id="signup-password" name="password" type="password" placeholder="Enter your password" autocomplete="new-password" required>
                  <button type="button" class="toggle-pass" aria-label="Toggle password visibility" data-toggle-pass="signup-password">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path>
                      <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                  </button>
                </div>
              </div>

              <button class="submit" type="submit">Sign Up</button>
              <button class="switch-btn" type="button" data-switch-to="login">Already a member? Sign in</button>
            </form>
          </div>
        </section>

        <div class="legal">
          <p>By signing in, you agree to our <a href="/policy">Policy</a>, <a href="/terms">Terms</a> and <a href="/privacy">Privacy</a>.</p>
        </div>
      </div>
    </div>
  </main>

  <script>
    (function () {
      const header = document.querySelector('header');
      if (!header) {
        return;
      }

      const enterScrolledAt = 24;
      const leaveScrolledAt = 8;
      let isScrolled = false;
      let ticking = false;

      const applyNavState = () => {
        const y = window.scrollY;
        if (!isScrolled && y >= enterScrolledAt) {
          header.classList.add('nav-scrolled');
          isScrolled = true;
        } else if (isScrolled && y <= leaveScrolledAt) {
          header.classList.remove('nav-scrolled');
          isScrolled = false;
        }
      };

      const onScroll = () => {
        if (ticking) {
          return;
        }
        ticking = true;
        requestAnimationFrame(() => {
          applyNavState();
          ticking = false;
        });
      };

      applyNavState();
      window.addEventListener('scroll', onScroll, { passive: true });
    })();

    (function () {
      const panels = Array.from(document.querySelectorAll('[data-mode]'));
      const switches = Array.from(document.querySelectorAll('[data-switch-to]'));

      const setMode = (mode) => {
        panels.forEach((panel) => {
          panel.classList.toggle('active', panel.getAttribute('data-mode') === mode);
        });
      };

      switches.forEach((button) => {
        button.addEventListener('click', () => {
          const mode = button.getAttribute('data-switch-to') || 'login';
          setMode(mode);
        });
      });

      const toggleButtons = Array.from(document.querySelectorAll('[data-toggle-pass]'));
      toggleButtons.forEach((button) => {
        button.addEventListener('click', () => {
          const inputId = button.getAttribute('data-toggle-pass');
          const input = inputId ? document.getElementById(inputId) : null;
          if (!input) {
            return;
          }
          input.type = input.type === 'password' ? 'text' : 'password';
        });
      });
    })();
  </script>
</body>
</html>
